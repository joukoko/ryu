<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ece3cf">
<title>Ryū – the ten forms</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  @font-face {
    font-family: "Cormorant Garamond";
    font-weight: 500 700;
    font-display: swap;
    src: url("fonts/cormorant-latin.woff2") format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F;
  }
  @font-face {
    font-family: "Cormorant Garamond";
    font-weight: 500 700;
    font-display: swap;
    src: url("fonts/cormorant-latin-ext.woff2") format("woff2");
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 28px 16px 48px;
    background: #e6dcc6;
    color: #17140f;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-weight: 500;
  }
  header { max-width: 1160px; margin: 0 auto 24px; }
  h1 { margin: 0; font-size: clamp(1.8rem, 6vw, 2.6rem); font-weight: 700; letter-spacing: 0.04em; }
  h1 i { font-style: normal; color: #d7362b; }
  header p { margin: 6px 0 0; font-size: 1.15rem; color: #6f6654; }
  header a { color: inherit; }
  main { max-width: 1160px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 540px), 1fr)); gap: 18px; }
  figure { margin: 0; background: #f1e9d6; border: 1px solid #cfc3a6; }
  img { display: block; width: 100%; height: auto; }
  figcaption { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 10px 14px 12px; }
  figcaption b { font-size: 1.3rem; font-weight: 700; }
  figcaption span { color: #6f6654; font-size: 1.05rem; white-space: nowrap; }
  figcaption small { display: block; font-size: 1rem; color: #6f6654; font-weight: 500; }
</style>
</head>
<body>
<header>
  <h1>The ten forms<i>.</i></h1>
  <p>A new form every hundred points. Every picture is from the game. <a href="./">Back to the game</a></p>
</header>
<main>
  <figure><img src="forms/form-1.png" alt="Koi" width="900" height="460"><figcaption><div><b>1 · Koi</b><small>Red spot on the forehead, tail and fins</small></div><span>0 pts</span></figcaption></figure>
  <figure><img src="forms/form-2.png" alt="Butterfly koi" width="900" height="460" loading="lazy"><figcaption><div><b>2 · Butterfly koi</b><small>Long flowing fins, red patches, barbels</small></div><span>100 pts</span></figcaption></figure>
  <figure><img src="forms/form-3.png" alt="Water serpent" width="900" height="460" loading="lazy"><figcaption><div><b>3 · Water serpent</b><small>Long, thin and banded</small></div><span>200 pts</span></figcaption></figure>
  <figure><img src="forms/form-4.png" alt="Horned serpent" width="900" height="460" loading="lazy"><figcaption><div><b>4 · Horned serpent</b><small>Horns, a red sail down the back, a jaw that opens</small></div><span>300 pts</span></figcaption></figure>
  <figure><img src="forms/form-5.png" alt="Young dragon" width="900" height="460" loading="lazy"><figcaption><div><b>5 · Young dragon</b><small>Legs, back spikes, a mane</small></div><span>400 pts</span></figcaption></figure>
  <figure><img src="forms/form-6.png" alt="Dragon" width="900" height="460" loading="lazy"><figcaption><div><b>6 · Dragon</b><small>Red belly and mane, scales, fangs</small></div><span>500 pts</span></figcaption></figure>
  <figure><img src="forms/form-7.png" alt="Storm dragon" width="900" height="460" loading="lazy"><figcaption><div><b>7 · Storm dragon</b><small>Lightning spikes, electricity round the body, ice-blue eyes</small></div><span>600 pts</span></figcaption></figure>
  <figure><img src="forms/form-8.png" alt="Mountain dragon" width="900" height="460" loading="lazy"><figcaption><div><b>8 · Mountain dragon</b><small>Stone plates on the back, glowing cracks</small></div><span>700 pts</span></figcaption></figure>
  <figure><img src="forms/form-9.png" alt="Sky dragon" width="900" height="460" loading="lazy"><figcaption><div><b>9 · Sky dragon</b><small>Gold wings, belly and mane</small></div><span>800 pts</span></figcaption></figure>
  <figure><img src="forms/form-10.png" alt="Ryūjin" width="900" height="460" loading="lazy"><figcaption><div><b>10 · Ryūjin</b><small>A back of flame, crown horns, a fire pearl</small></div><span>900 pts</span></figcaption></figure>
</main>
</body>
</html>

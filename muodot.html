<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ece3cf">
<title>Ryū – kymmenen muotoa</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  @font-face {
    font-family: "Cormorant Garamond";
    font-weight: 500 700;
    font-display: swap;
    src: url("fonts/cormorant-latin.woff2") format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F;
  }
  @font-face {
    font-family: "Cormorant Garamond";
    font-weight: 500 700;
    font-display: swap;
    src: url("fonts/cormorant-latin-ext.woff2") format("woff2");
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 28px 16px 48px;
    background: #e6dcc6;
    color: #17140f;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-weight: 500;
  }
  header { max-width: 1160px; margin: 0 auto 24px; }
  h1 { margin: 0; font-size: clamp(1.8rem, 6vw, 2.6rem); font-weight: 700; letter-spacing: 0.04em; }
  h1 i { font-style: normal; color: #d7362b; }
  header p { margin: 6px 0 0; font-size: 1.15rem; color: #6f6654; }
  header a { color: inherit; }
  main { max-width: 1160px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 540px), 1fr)); gap: 18px; }
  figure { margin: 0; background: #f1e9d6; border: 1px solid #cfc3a6; }
  img { display: block; width: 100%; height: auto; }
  figcaption { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 10px 14px 12px; }
  figcaption b { font-size: 1.3rem; font-weight: 700; }
  figcaption span { color: #6f6654; font-size: 1.05rem; white-space: nowrap; }
  figcaption small { display: block; font-size: 1rem; color: #6f6654; font-weight: 500; }
</style>
</head>
<body>
<header>
  <h1>Kymmenen muotoa<i>.</i></h1>
  <p>Uusi muoto aina sadan pisteen välein. Jokainen kuva on pelistä. <a href="./">Takaisin peliin</a></p>
</header>
<main>
  <figure><img src="muodot/muoto-1.png" alt="Koi" width="900" height="460"><figcaption><div><b>1 · Koi</b><small>Punainen täplä otsassa, pyrstö ja evät</small></div><span>0 p</span></figcaption></figure>
  <figure><img src="muodot/muoto-2.png" alt="Perhoskoi" width="900" height="460" loading="lazy"><figcaption><div><b>2 · Perhoskoi</b><small>Pitkät liehuvat evät, punaiset laikut, viikset</small></div><span>100 p</span></figcaption></figure>
  <figure><img src="muodot/muoto-3.png" alt="Vesikäärme" width="900" height="460" loading="lazy"><figcaption><div><b>3 · Vesikäärme</b><small>Pitkä ja ohut, raidallinen</small></div><span>200 p</span></figcaption></figure>
  <figure><img src="muodot/muoto-4.png" alt="Sarvikäärme" width="900" height="460" loading="lazy"><figcaption><div><b>4 · Sarvikäärme</b><small>Sarvet, punainen selkäpurje, aukeava kita</small></div><span>300 p</span></figcaption></figure>
  <figure><img src="muodot/muoto-5.png" alt="Nuori lohikäärme" width="900" height="460" loading="lazy"><figcaption><div><b>5 · Nuori lohikäärme</b><small>Jalat, selkäpiikit, harja</small></div><span>400 p</span></figcaption></figure>
  <figure><img src="muodot/muoto-6.png" alt="Lohikäärme" width="900" height="460" loading="lazy"><figcaption><div><b>6 · Lohikäärme</b><small>Punainen vatsa ja harja, suomut, hampaat</small></div><span>500 p</span></figcaption></figure>
  <figure><img src="muodot/muoto-7.png" alt="Myrskylohikäärme" width="900" height="460" loading="lazy"><figcaption><div><b>7 · Myrskylohikäärme</b><small>Salamapiikit, sähkö rungon ympärillä, jäänsiniset silmät</small></div><span>600 p</span></figcaption></figure>
  <figure><img src="muodot/muoto-8.png" alt="Vuorten lohikäärme" width="900" height="460" loading="lazy"><figcaption><div><b>8 · Vuorten lohikäärme</b><small>Kivilaatat selässä, hehkuvat halkeamat</small></div><span>700 p</span></figcaption></figure>
  <figure><img src="muodot/muoto-9.png" alt="Taivaan lohikäärme" width="900" height="460" loading="lazy"><figcaption><div><b>9 · Taivaan lohikäärme</b><small>Kultaiset siivet, vatsa ja harja</small></div><span>800 p</span></figcaption></figure>
  <figure><img src="muodot/muoto-10.png" alt="Ryūjin" width="900" height="460" loading="lazy"><figcaption><div><b>10 · Ryūjin</b><small>Liekehtivä selkä, kruunusarvet, tulihelmi</small></div><span>900 p</span></figcaption></figure>
</main>
</body>
</html>
